name: Release image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to publish; select the same workflow ref"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

# Finish publishing and signing one release before starting another.
concurrency:
  group: release-image
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Set {{REPO}} to the lower-case owner/repository path required by GHCR.
  IMAGE: ghcr.io/{{REPO}}

jobs:
  # Gate first: a release never builds or publishes before lint, tests and documentation pass.
  gate:
    name: Lint, test and documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      # Replace this placeholder with toolchain and dependency installation, and add the
      # test database service from tests-on-pr.yaml when make test needs one.
      # - name: set up the toolchain ({{STACK}})
      #   run: your toolchain setup command
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Check documentation
        run: make docs-check
      - name: Check rule contracts
        run: make test-agent-rules

  release:
    name: Publish and sign amd64 + arm64
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Use a stable release tag vX.Y.Z (no leading zeroes).'
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo '::error::Select the same release tag as the workflow ref and tag input.'
            exit 1
          fi
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'minor_tag=%s\n' "${RELEASE_TAG%.*}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require release commit on {{DEFAULT_BRANCH}}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/{{DEFAULT_BRANCH}}; then
            echo '::error::Release tags must point to a commit reachable from origin/{{DEFAULT_BRANCH}}.'
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=${{ steps.release.outputs.minor_tag }}

      - name: Build and push both platforms
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # BuildKit attaches provenance and SBOMs; sign their enclosing image index.
      # A second provenance producer is unnecessary for this release path.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image digest with GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summarize published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            printf '### Published %s\n\n' "$RELEASE_TAG"
            printf '`%s@%s`\n\n' "$IMAGE" "$DIGEST"
            printf 'Platforms: `linux/amd64`, `linux/arm64`.\n\n'
            printf 'BuildKit provenance (`mode=max`), SBOMs and a cosign keyless signature are attached.\n'
          } >> "$GITHUB_STEP_SUMMARY"
